name: Heti egészségellenőrzés

# Hetente lefut, és élesben kipróbálja az árforrásokat. Ha valamelyik elromlott
# (pl. megváltozott egy oldal), hibajegyet nyit – erről a GitHub e-mailt küld.
on:
  schedule:
    - cron: "17 5 * * 1"   # hétfőnként 05:17 UTC (7:17 magyar idő)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Árforrások élő próbája
        id: run
        continue-on-error: true
        run: gradle -p desktop test --no-daemon -Drefi.health=true --tests '*HealthTest*'

      - name: Eredmény
        if: always()
        run: cat desktop/build/diag/health.txt 2>/dev/null || echo "(nincs jelentés)"

      - name: Hibajegy nyitása, ha valami elromlott
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="A heti ellenőrzés hibát talált ($(date -u +%Y-%m-%d)):"$'\n\n```\n'"$(cat desktop/build/diag/health.txt 2>/dev/null || echo 'nincs jelentés')"$'\n```\n\n'"Futás: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=egeszseg" --jq 'length' 2>/dev/null || echo 0)
          if [ "$open" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/labels" -f name=egeszseg -f color=d93f0b >/dev/null 2>&1 || true
            gh api -X POST "repos/${{ github.repository }}/issues" -f title="REFI: egy árforrás nem működik" -f body="$body" -f "labels[]=egeszseg" --jq .html_url
          else
            num=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=egeszseg" --jq '.[0].number')
            gh api -X POST "repos/${{ github.repository }}/issues/$num/comments" -f body="$body" --jq .html_url
          fi
          exit 1
