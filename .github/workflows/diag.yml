name: Diagnosztika

# Csak kézi indításra fut (fejlesztői hibakereséshez). Nem készít kiadást:
# az eredményt egy rejtett (vázlat) kiadás "diag.txt" fájljába teszi.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Egységtesztek
        continue-on-error: true
        run: |
          gradle -p desktop test --no-daemon 2>&1 | tee unit.log
          mkdir -p unit-results && cp desktop/build/test-results/test/*.xml unit-results/ 2>/dev/null || true

      - name: Éles árforrás-próba
        continue-on-error: true
        run: gradle -p desktop test --no-daemon -Drefi.live=true --tests '*LiveSourcesTest*' 2>&1 | tee live.log | tail -5

      - name: Képernyőképek
        continue-on-error: true
        run: gradle -p desktop test --no-daemon -Drefi.screens=true --tests '*ScreenshotTest*' 2>&1 | tee screens.log | tail -30

      - name: Android lint
        continue-on-error: true
        run: |
          gradle :app:checkReleaseAarMetadata --no-daemon 2>&1 | tee aar.log | tail -5
          gradle :app:lintDebug --no-daemon 2>&1 | tail -20

      - name: Jelentés összeállítása és feltöltése
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Commit: $(git rev-parse --short HEAD)"
            echo "### EGYSÉGTESZTEK"
            grep -E "Test.*(FAILED|PASSED)|tests completed|BUILD|e: |AssertionError|Expected|expected" unit.log | head -80 || true
            for f in unit-results/*.xml; do
              [ -f "$f" ] && grep -oE 'testsuite name="[^"]+" tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$f"
            done
            echo
            echo "### ÉLES ÁRFORRÁSOK"
            cat desktop/build/diag/live.txt 2>/dev/null || { echo "(nincs live.txt)"; tail -60 live.log 2>/dev/null; }
            echo
            echo "### KÉPERNYŐKÉPEK"
            ls desktop/build/screens 2>/dev/null || echo "(nincsenek)"
            cat desktop/build/screens/hibak.txt 2>/dev/null || true
            grep -E "FAILED|Exception|Error|error:|e: " screens.log 2>/dev/null | head -60 || true
            tail -25 screens.log 2>/dev/null || true
            echo
            echo "### ANDROID FÜGGŐSÉGEK"
            grep -v "^\s*$" aar.log 2>/dev/null | grep -iE "requires|depend|compileSdk|AGP|error|wrong" | head -40 || true
            echo
            echo "### ANDROID LINT"
            cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "(nincs lint-jelentés)"
          } > diag.txt
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[]|select(.draft and .name=="diagnostics")][0].id // empty')
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name=diagnostics -f name=diagnostics -F draft=true -F prerelease=true -f body="Fejlesztői diagnosztika (nem kiadás)" --jq .id)
          fi
          old=$(gh api "repos/${{ github.repository }}/releases/$id/assets" --jq '.[]|select(.name=="diag.txt")|.id')
          [ -n "$old" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
          upload() {
            local file="$1" name="$2" type="$3"
            local old
            old=$(gh api "repos/${{ github.repository }}/releases/$id/assets?per_page=100" --jq ".[]|select(.name==\"$name\")|.id")
            [ -n "$old" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $type" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$name" > /dev/null
          }
          upload diag.txt diag.txt text/plain
          for f in desktop/build/screens/*.png desktop/build/screens/*.txt; do
            [ -f "$f" ] && upload "$f" "$(basename "$f")" "$( [[ $f == *.png ]] && echo image/png || echo text/plain )"
          done
          echo "kész"

      # A jelentés feltöltése után: ha egységteszt bukott, a futás is legyen piros (ne csak a diag.txt-ben látsszon)
      - name: Egységtesztek eredménye
        shell: bash
        run: |
          # Csak az egységteszt-futás összesítő sorai (a jelentésben is ezek látszanak)
          bad=$(cat unit-results/*.xml 2>/dev/null | grep -oE '<testsuite [^>]*' | grep -cE '(failures|errors)="[1-9]')
          if [ "$bad" -gt 0 ] || grep -qE "tests completed, [0-9]+ failed" unit.log 2>/dev/null; then
            grep -E "FAILED" unit.log | sed 's/^/::error::/' | head -20
            exit 1
          fi
          echo "::notice::Minden egységteszt rendben"
