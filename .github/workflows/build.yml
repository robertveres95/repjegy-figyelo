name: APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK fordítása
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk RepjegyFigyelo.apk

      - name: Letölthető kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Repjegy figyelő – ${{ github.run_number }}. build
          body: "Töltsd le a RepjegyFigyelo.apk fájlt a telefonodra, és telepítsd."
          files: RepjegyFigyelo.apk
          make_latest: true
