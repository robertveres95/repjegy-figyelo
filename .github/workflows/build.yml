name: APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK fordítása
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Fordítási hibák kiírása
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk RepjegyFigyelo.apk

      - name: Letölthető kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Repjegy figyelő 1.0.${{ github.run_number }}
          body: "Töltsd le a RepjegyFigyelo.apk fájlt a telefonodra, és telepítsd."
          files: RepjegyFigyelo.apk
          make_latest: true
