name: APK build

# - Push a main ágra: TESZT-build ("prerelease"). Letölthető kipróbálásra,
#   de a telepített appok frissítésfigyelője NEM ajánlja fel (csak éles kiadást néz).
# - "v*" címke pusholása vagy kézi indítás publish=true-val: ÉLES kiadás.
#   Ezt csak akkor csináljuk, ha a tulajdonos kifejezetten kéri.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Éles kiadás (a felhasználók appja felajánlja a frissítést)"
        type: boolean
        default: false

permissions:
  contents: write

# Éles kiadások sorban futnak (a „legfrissebb” jelölés ne cserélődhessen fel); a teszt-buildek
# mindegyike saját csoportot kap, így egy újabb push nem dobhat el egy várakozó éles kiadást
concurrency:
  group: ${{ (github.ref_type == 'tag' || inputs.publish) && 'refi-publish' || format('refi-test-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Verzió és kiadás típusa
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=REFI $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=teszt-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=REFI $VERSION – teszt (${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi

      - name: APK fordítása
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Fordítási hibák kiírása
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk REFI.apk

      - name: Kiadás létrehozása
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.publish == 'true' && 'Töltsd le a REFI.apk fájlt a telefonodra, és telepítsd.' || 'Teszt-build, csak kipróbálásra. A telepített appok nem ajánlják fel frissítésként.' }}
          files: REFI.apk
          prerelease: ${{ steps.meta.outputs.publish != 'true' }}
          # Csak akkor lesz „legfrissebb”, ha a Windows-telepítő is felkerült (lásd lent):
          # így egyik platform sem kap félkész kiadást
          make_latest: false

  # Windows-változat: ugyanabba a kiadásba kerül a REFI-Setup.msi
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Windows-telepítő fordítása
        shell: bash
        run: |
          set -o pipefail
          gradle -p desktop packageMsi --no-daemon 2>&1 | tee build.log

      - name: Fordítási hibák kiírása
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:|Error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Önteszt a kész appon
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter REFI.exe | Select-Object -First 1
          if (-not $exe) { gradle -p desktop createDistributable --no-daemon; $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter REFI.exe | Select-Object -First 1 }
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest=$out" -Wait -PassThru
          Get-Content $out -Encoding UTF8 | ForEach-Object { Write-Output $_ }
          Get-Content $out -Encoding UTF8 | Where-Object { $_ -like "FAIL*" } | ForEach-Object { Write-Output "::error::$_" }
          Get-Content $out -Encoding UTF8 | Where-Object { $_ -like "ÖSSZESEN*" } | ForEach-Object { Write-Output "::notice::$_" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Telepítő átnevezése
        shell: bash
        run: cp desktop/build/compose/binaries/main/msi/*.msi REFI-Setup.msi

      - name: Feltöltés a kiadáshoz
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          files: REFI-Setup.msi
          prerelease: ${{ needs.build.outputs.publish != 'true' }}
          make_latest: ${{ needs.build.outputs.publish == 'true' }}

      - name: Kiadás megjelölése legfrissebbként
        if: needs.build.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ needs.build.outputs.tag }}" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f make_latest=true --jq '.tag_name'
