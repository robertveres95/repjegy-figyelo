name: APK build

# - Push a main ágra: TESZT-build ("prerelease"). Letölthető kipróbálásra,
#   de a telepített appok frissítésfigyelője NEM ajánlja fel (csak éles kiadást néz).
# - "v*" címke pusholása vagy kézi indítás publish=true-val: ÉLES kiadás.
#   Ezt csak akkor csináljuk, ha a tulajdonos kifejezetten kéri.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Éles kiadás (a felhasználók appja felajánlja a frissítést)"
        type: boolean
        default: false

permissions:
  contents: write

# Éles kiadások sorban futnak (a „legfrissebb” jelölés ne cserélődhessen fel). A teszt-buildek
# mindegyike saját csoportot kap, így egy push nem dobhat el várakozó éles kiadást.
# (A GitHub csoportonként egy várakozó futást tart meg: két éles kiadást ne indíts gyorsan egymás után.)
concurrency:
  group: ${{ (github.ref_type == 'tag' || inputs.publish) && 'refi-publish' || format('refi-test-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Verzió és kiadás típusa
        id: meta
        shell: bash
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" || "${{ inputs.publish }}" == "true" ]]; then
            # Éles kiadáshoz kötelező az „Újdonságok” szövege ehhez a verzióhoz (WhatsNew.kt)
            if ! grep -qF "\"$VERSION\" to listOf(" shared/src/main/kotlin/hu/repjegy/figyelo/WhatsNew.kt; then
              echo "::error::Hiányzik a(z) $VERSION verzió újdonság-szövege a WhatsNew.kt-ból"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=REFI $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=teszt-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=REFI $VERSION – teszt (${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi

      - name: APK fordítása
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Fordítási hibák kiírása
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Aláírás kulcscserével (APK Signature Scheme v3 „rotation”): a régi, nyilvános
      # fejlesztői kulcsról a saját REFI-kulcsra váltunk úgy, hogy a már telepített appok
      # gond nélkül frissüljenek (nem kell újratelepíteni, a figyelések megmaradnak).
      # Android 9+ ettől kezdve csak az új kulccsal aláírt frissítést fogadja el.
      - name: APK aláírása
        shell: bash
        env:
          REFI_KEYSTORE_PASS: ${{ secrets.REFI_KEYSTORE_PASS }}
          REFI_KEYSTORE_B64: ${{ secrets.REFI_KEYSTORE_B64 }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          OLD=(--ks app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android)
          # Az aláíró kulcs a GitHub titkai közül jön (REFI_KEYSTORE_B64), nem a nyilvános tárolóból
          KS="$RUNNER_TEMP/refi-release.jks"
          if [ -n "${REFI_KEYSTORE_B64:-}" ]; then
            printf '%s' "$REFI_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KS"
            echo "::notice::Aláíró kulcs: GitHub-titokból"
          else
            REFI_KEYSTORE_PASS=""
          fi
          if [ -n "${REFI_KEYSTORE_PASS:-}" ]; then
            NEW=(--ks "$KS" --ks-pass env:REFI_KEYSTORE_PASS --ks-key-alias refi --key-pass env:REFI_KEYSTORE_PASS)
            "$BT/apksigner" rotate --out lineage.bin \
              --old-signer "${OLD[@]}" --set-rollback false \
              --new-signer "${NEW[@]}"
            "$BT/apksigner" sign "${OLD[@]}" --next-signer "${NEW[@]}" \
              --lineage lineage.bin --rotation-min-sdk-version 28 \
              --v4-signing-enabled false --out REFI.apk aligned.apk
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Hiányzik a REFI_KEYSTORE_PASS vagy a REFI_KEYSTORE_B64 titok – éles kiadás csak az új kulccsal készülhet"
              exit 1
            fi
            echo "::warning::Nincs REFI_KEYSTORE_PASS titok: a teszt-build a régi fejlesztői kulccsal készül"
            "$BT/apksigner" sign "${OLD[@]}" --v4-signing-enabled false --out REFI.apk aligned.apk
          fi
          "$BT/apksigner" verify -v --print-certs REFI.apk > verify.txt
          grep -E "Verified using|certificate SHA-256" verify.txt || true
          if [ -f lineage.bin ]; then
            "$BT/apksigner" lineage --in REFI.apk --print-certs > lineage.txt
            cat lineage.txt
            echo "::notice::APK aláírva az új REFI-kulccsal (kulcscsere-lánccal)"
          fi

      # A kulcscsere parancsainak próbája egy eldobható kulccsal – így a folyamat akkor is
      # ellenőrzött, amikor a valódi titok még nincs beállítva
      - name: Kulcscsere próbája
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore /tmp/dry.jks -storetype PKCS12 -alias dry -keyalg RSA -keysize 2048 \
            -validity 365 -storepass dryrun123 -keypass dryrun123 -dname "CN=dry" > /dev/null 2>&1
          OLD=(--ks app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android)
          NEW=(--ks /tmp/dry.jks --ks-pass pass:dryrun123 --ks-key-alias dry --key-pass pass:dryrun123)
          "$BT/apksigner" rotate --out /tmp/dry.lineage --old-signer "${OLD[@]}" --set-rollback false --new-signer "${NEW[@]}"
          "$BT/apksigner" sign "${OLD[@]}" --next-signer "${NEW[@]}" --lineage /tmp/dry.lineage \
            --rotation-min-sdk-version 28 --v4-signing-enabled false --out /tmp/dry.apk aligned.apk
          "$BT/apksigner" verify -v /tmp/dry.apk | grep -E "Verified using" || true
          "$BT/apksigner" lineage --in /tmp/dry.apk --print-certs | grep -c "Signer" | xargs -I{} echo "lánc tagjai: {}"
          echo "::notice::Kulcscsere-próba rendben"

      - name: Chrome-bővítmény csomagolása
        shell: bash
        run: |
          cd chrome-extension
          zip -r -q ../REFI-Chrome.zip . -x 'test/*'
          cd ..
          unzip -l REFI-Chrome.zip | tail -1

      - name: Kiadás létrehozása
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.publish == 'true' && 'Töltsd le a REFI.apk fájlt a telefonodra, és telepítsd. A Chrome-bővítmény a REFI-Chrome.zip (telepítése a tároló leírásában).' || 'Teszt-build, csak kipróbálásra. A telepített appok nem ajánlják fel frissítésként.' }}
          files: |
            REFI.apk
            REFI-Chrome.zip
          prerelease: ${{ steps.meta.outputs.publish != 'true' }}
          # Csak akkor lesz „legfrissebb”, ha a Windows-telepítő is felkerült (lásd lent):
          # így egyik platform sem kap félkész kiadást
          make_latest: false

  # Windows-változat: ugyanabba a kiadásba kerül a REFI-Setup.msi
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Windows-telepítő fordítása
        shell: bash
        run: |
          set -o pipefail
          gradle -p desktop packageMsi --no-daemon 2>&1 | tee build.log

      - name: Fordítási hibák kiírása
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|error:|Error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Önteszt a kész appon
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter REFI.exe | Select-Object -First 1
          if (-not $exe) { gradle -p desktop createDistributable --no-daemon; $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter REFI.exe | Select-Object -First 1 }
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest=$out" -Wait -PassThru
          Get-Content $out -Encoding UTF8 | ForEach-Object { Write-Output $_ }
          Get-Content $out -Encoding UTF8 | Where-Object { $_ -like "FAIL*" } | ForEach-Object { Write-Output "::error::$_" }
          Get-Content $out -Encoding UTF8 | Where-Object { $_ -like "ÖSSZESEN*" } | ForEach-Object { Write-Output "::notice::$_" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Telepítő átnevezése
        shell: bash
        run: cp desktop/build/compose/binaries/main/msi/*.msi REFI-Setup.msi

      - name: Feltöltés a kiadáshoz
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          files: REFI-Setup.msi
          prerelease: ${{ needs.build.outputs.publish != 'true' }}
          make_latest: ${{ needs.build.outputs.publish == 'true' }}

      - name: Kiadás megjelölése legfrissebbként
        if: needs.build.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ needs.build.outputs.tag }}" --jq .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f make_latest=true --jq '.tag_name'
