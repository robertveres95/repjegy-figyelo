<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><link rel="stylesheet" href="../popup.css"></head>
<body>
  <header><div class="brand"><img src="../icons/icon32.png" alt="" width="22" height="22"><span>REFI</span></div>
  <div class="actions"><button id="refresh" class="icon" hidden>⟳</button><button id="signout" class="link" hidden data-en="Sign out" data-de="Abmelden">Kijelentkezés</button></div></header>
  <main id="main">
    <section id="signin" class="center" hidden><p class="lead" data-en="Sign in with the same Google account you use in the REFI app." data-de="Melde dich mit demselben Google-Konto an, das du in der REFI-App nutzt.">Jelentkezz be ugyanazzal a Google-fiókkal, amit a REFI appban használsz.</p><button id="signin-btn" class="primary" data-en="Sign in with Google" data-de="Mit Google anmelden">Bejelentkezés Google-fiókkal</button><p class="muted small" data-en="The extension only reads your watches from REFI's hidden Drive area – it sees nothing else and changes nothing." data-de="Die Erweiterung liest nur deine Beobachtungen aus dem versteckten Drive-Bereich von REFI – sie sieht nichts anderes und ändert nichts.">A bővítmény csak olvassa a figyeléseidet a REFI rejtett Drive-területéről – mást nem lát, és nem módosít semmit.</p></section>
    <section id="loading" class="center" hidden><div class="spinner"></div><p class="muted" data-en="Loading watches…" data-de="Beobachtungen werden geladen…">Figyelések betöltése…</p></section>
    <section id="empty" class="center" hidden></section>
    <p id="error" class="error" hidden></p><ul id="list" class="list"></ul>
  </main>
  <footer id="footer" class="muted small" hidden></footer>
  <script src="../config.js"></script>
  <script src="../badge.js"></script>
  <script src="../cities.js"></script>
  <script src="demo-data.js"></script>
  <script src="../popup.js"></script>
</body></html>
